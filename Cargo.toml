[package]
name = "ncheap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Namecheap registrar API CLI built for terminal and AI-agent operability"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jkindrix/ncheap"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
# Lock in the post-2018 module layout (src/api.rs, not src/api/mod.rs).
# tests/common/mod.rs is exempt by design: in tests/ the mod.rs form is the
# documented idiom for sharing helpers without creating a test binary.
mod_module_files = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.40", features = ["serialize"] }
ureq = "3.3"
toml = "1.1"
thiserror = "2.0"
dirs = "6.0"
psl = "2.1.212"
idna = "1.1.0"
