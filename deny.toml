# cargo-deny configuration: advisories, license allowlist, and source checks.

[advisories]
yanked = "deny"

[licenses]
# Everything in the current tree; additions require a conscious decision here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "0BSD",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
